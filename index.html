<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c22">
<meta name="description" content="115學年新竹區適性安置地圖：查看各校位置、開缺科別與名額，並比較離家與火車站的距離。">
<title>115學年新竹區適性安置地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 島嶼地圖為主舞台（左），學校／群別說明卡在右；手機上下堆疊，最下方是可篩選的完整名額表 */
:root{
  /* 深色版面：所有觀看者都使用這一組，不隨系統切換 */
  --bg:#101c22; --surface:#1a2b33; --fg:#f3f8f9; --muted:#bccbd0; --line:#2f4651;
  --accent:#7fdce6; --accent-soft:#21434c; --chip:#22363f; --warm:#ffb07c;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,4vw,2.5rem);margin:0;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
.notice{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 16px;border-radius:16px;background:color-mix(in srgb,var(--warm) 16%,var(--surface));color:var(--fg);font-size:.95rem;border:1.5px solid color-mix(in srgb,var(--warm) 45%,transparent)}
.notice svg{color:var(--warm);flex:none;margin-top:3px}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.1;color:var(--accent)}
.stats span{font-size:.78rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;color:var(--fg);font:inherit;width:100%;outline:none}
.btn{font:inherit;font-size:.88rem;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:focus-visible,.chip:focus-visible,.row-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-family:var(--f-display);font-size:.9rem;display:inline-flex;align-items:center;gap:6px;border:2px solid transparent;background:color-mix(in srgb,var(--c) 26%,var(--surface));color:var(--fg);border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.chip em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.78rem}
.chip:hover{transform:translateY(-1px)}
.chip{transition:transform .15s}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.chip[aria-pressed="true"] em{color:#fff}
.chip[aria-pressed="true"] i{background:#fff}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border-radius:28px;overflow:hidden;background:#7fc4d6;box-shadow:0 10px 30px rgba(0,0,0,.4);border:4px solid var(--surface)}
.mapbox svg{display:block;width:100%;height:auto;touch-action:pan-x pan-y}
/* 全螢幕地圖：地圖單獨佔滿整個畫面 */
.mapbox.full{position:fixed;inset:0;z-index:60;border-radius:0;border:0;box-shadow:none;background:#5fb0c9}
.mapbox.full svg{width:100%;height:100%;touch-action:none}
.mapbox.full .maptools{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px))}
.mapbox.full .sidectl{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.mapbox.full .phase{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.mapbox.full.has-mini .phase{display:none}
.fullcat{display:none;position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));align-items:center;gap:8px;background:rgba(20,36,43,.92);color:#e6f0f2;border-radius:999px;padding:4px 6px 4px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35);font-family:var(--f-display);font-size:.9rem}
.fullcat select{font:inherit;font-size:.95rem;color:#10232a;background:#7fdce6;border:0;border-radius:999px;padding:6px 10px}
.mapbox.full .fullcat{display:inline-flex}
body.lock{overflow:hidden}
.fullpill{position:absolute;left:12px;bottom:12px;display:none;align-items:center;gap:6px;font:inherit;font-family:var(--f-display);font-size:.95rem;border:0;border-radius:999px;padding:8px 14px;background:#ff9a6b;color:#1a1410;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
.mapbox.full .fullpill{display:none!important}
.coop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,18,22,.5);color:#fff;font-family:var(--f-display);font-size:1.05rem;text-align:center;padding:24px;pointer-events:none;opacity:0;transition:opacity .25s}
.coop.show{opacity:1}
.mini{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));background:rgba(20,36,43,.95);color:#f3f8f9;border-radius:20px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px}
.mini h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.2rem;line-height:1.3}
.mini p{margin:0;font-size:.9rem;color:#cfdde1}
.mini .acts{display:flex;flex-wrap:wrap;gap:8px}
.mini .acts a,.mini .acts button{font:inherit;font-size:.88rem;text-decoration:none;border:1.5px solid #7fdce6;color:#7fdce6;background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer}
.mini .acts .primary{background:#7fdce6;color:#10232a;border-color:#7fdce6}
@media (pointer:coarse){.fullpill{display:inline-flex}}
.maptools{position:absolute;top:12px;left:12px;display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:999px;background:rgba(20,36,43,.88);box-shadow:0 4px 14px rgba(0,0,0,.35);max-width:calc(100% - 80px)}
.seg{font:inherit;font-family:var(--f-display);font-size:.9rem;border:0;background:transparent;color:#e6f0f2;border-radius:999px;padding:5px 12px;cursor:pointer}
.seg:hover{background:rgba(255,255,255,.1)}
.seg[aria-pressed="true"]{background:#ff9a6b;color:#1a1410;font-weight:700}
.sidectl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.rbtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(20,36,43,.88);color:#e6f0f2;font-size:1.15rem;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);font-family:var(--f-display)}
.rbtn:hover{background:#21434c;color:#7fdce6}
.rbtn[aria-pressed="true"]{background:#e8554e;color:#fff}
@media (max-width:600px){
  .maptools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:calc(100% - 72px)}
  .maptools::-webkit-scrollbar{display:none}
  .seg{white-space:nowrap;font-size:.8rem;padding:5px 10px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .chip{white-space:nowrap;flex:none}
  .rbtn,.compass{width:36px;height:36px}
  .hint{display:none}
}
.seg:focus-visible,.rbtn:focus-visible{outline:3px solid #7fdce6;outline-offset:2px}
.compass{width:40px;height:40px;border-radius:50%;background:rgba(20,36,43,.88);box-shadow:0 4px 14px rgba(0,0,0,.35);color:#e6f0f2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;line-height:1}
.compass span{color:#ff7a6e;font-size:.9rem}
.phase{position:absolute;right:12px;bottom:12px;font-size:.8rem;background:rgba(20,36,43,.88);color:#e6f0f2;border-radius:999px;padding:4px 12px;border:0;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;font-family:inherit}
.hint{position:absolute;left:12px;bottom:12px;font-size:.8rem;color:#e6f0f2;background:rgba(20,36,43,.88);border-radius:999px;padding:4px 12px;max-width:60%;transition:opacity .6s}
.panel{background:var(--surface);border:0;box-shadow:0 10px 30px rgba(0,0,0,.3);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;line-height:1.25;text-wrap:balance}
.eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;border-radius:8px;padding:2px 9px;background:var(--accent-soft);color:var(--fg)}
.tag.warn{background:color-mix(in srgb,#e0582c 40%,var(--surface))}
.dept{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.92rem}
.dept .dot{width:10px;height:10px;border-radius:3px}
.dept .bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:6px}
.dept .bar span{display:block;height:100%}
.dept b{font-variant-numeric:tabular-nums;font-weight:700}
.dept small{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:4px}
.row-btn{font:inherit;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:7px 2px;cursor:pointer}
.row-btn:hover{color:var(--accent)}
.row-btn span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.link{color:var(--accent);font-weight:500;text-underline-offset:3px}
.note{font-size:.9rem;color:var(--muted);margin:0}
.tablebox{background:var(--surface);border:0;box-shadow:0 10px 30px rgba(0,0,0,.3);border-radius:28px;padding:18px 20px}
.tablebox h3{font-family:var(--f-display);font-weight:400;font-size:1.2rem;margin:0 0 10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-size:.82rem;color:var(--muted);font-weight:500;letter-spacing:.05em}
td.n{font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--accent-soft)}
.homebar{background:var(--surface);border:2px dashed var(--line);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.homebar.on{border-color:var(--accent)}
.hb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hb-row label{font-family:var(--f-display);font-size:1.05rem;margin-right:4px}
.hb-row select,.hb-row input{font:inherit;font-size:.9rem;color:var(--fg);background:var(--chip);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px}
.hb-row input{flex:1 1 240px;min-width:0}
.hb-row select:focus,.hb-row input:focus{outline:none;border-color:var(--accent)}
.homestat{font-size:.88rem;color:var(--fg)}
.homestat b{color:var(--accent)}
.routes{display:flex;flex-wrap:wrap;gap:8px}
.routes a{font-size:.85rem;text-decoration:none;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 12px}
.routes a:hover{background:var(--accent-soft)}
.dist{font-size:.95rem}
.dist b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--accent);font-variant-numeric:tabular-nums}
.pinning svg{cursor:crosshair}
.mapbox svg{cursor:grab}
.mapbox.dragging svg{cursor:grabbing}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* SVG */
.school{cursor:pointer}
.lbl-pill{pointer-events:none}
.bob{transition:transform .2s ease}
.school:hover .bob{transform:translateY(-5px)}
.school{transition:opacity .25s,filter .25s}
/* 選了一所學校：它放大，其他學校變灰 */
.has-sel .school:not(.sel){opacity:.28;filter:grayscale(1)}
.has-sel .school:not(.sel):hover{opacity:.7;filter:none}
.school.sel .bob{transform:translateY(-6px) scale(1.45)}
.has-sel .distline:not(.hot){opacity:.12!important}
.cloud{animation:cloud 60s linear infinite alternate}
@keyframes cloud{to{transform:translateX(120px)}}
.lbl-pill .pill{fill:#3b5560;stroke:#fffaf0;stroke-width:2.5}
.lbl-pill .pill-t{fill:#ffffff;font-family:var(--f-body);letter-spacing:.04em}
.school.sel .pill{fill:#ff7a45}
.school:hover .pill{fill:#0f7c8c}
.school.dim{opacity:.16;filter:grayscale(1)}
.glow{opacity:0;stroke:var(--lit,#ffd36b)}
.school.lit .glow{opacity:1;animation:glow 1.6s ease-in-out infinite}
.school.lit .bob{transform:scale(1.3)}
.school.lit.sel .bob{transform:translateY(-6px) scale(1.5)}
@keyframes glow{0%,100%{stroke-opacity:.95;stroke-width:7}50%{stroke-opacity:.35;stroke-width:12}}
.school.sel .halo{opacity:1}
.halo{opacity:0;transition:opacity .2s}
.town{font-family:var(--f-display);fill:#a08d5c;letter-spacing:.18em;pointer-events:none;opacity:.85}
.link-line{fill:none;stroke-width:2.5;stroke-dasharray:6 6;animation:flow 1.2s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-12}}
.wave{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.link-line,.wave,.cloud,.school.lit .glow{animation:none}.bob{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>115學年新竹區適性安置地圖</h1>
    <div class="stats">
      <div><b id="stS">22</b><span>所學校</span></div>
      <div><b id="stD">89</b><span>個開缺科別</span></div>
      <div><b id="stQ">577</b><span>安置名額</span></div>
    </div>
  </header>

  <p class="notice" role="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v6M12 16.8v.2"/></svg><span>此為115學年開缺學校及名額，僅供參考，詳細資訊仍依簡章公告為準。</span></p>

  <div class="tools">
    <label class="search" for="q">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="搜尋學校、科別或地區，例如：餐飲、資訊、竹東" autocomplete="off">
    </label>
    <button class="btn" id="reset" type="button">全部顯示</button>
  </div>
  <section class="homebar" id="homebar" aria-label="我家位置">
    <div class="hb-row">
      <label for="town">我家在</label>
      <select id="town"><option value="">選擇鄉鎮市區</option></select>
      <button class="btn" id="pin" type="button" aria-pressed="false">在地圖上點出我家</button>
      <button class="btn" id="clearHome" type="button" hidden>清除</button>
    </div>
    <div class="hb-row">
      <input id="addr" type="text" placeholder="（選填）輸入住址，查各校路線時直接帶入 Google 地圖" autocomplete="street-address">
    </div>
    <p class="note" id="homeNote">先選鄉鎮，再到地圖上點出家的位置會更準。住址只存在這台裝置的瀏覽器裡，按「查路線」時才會送到 Google 地圖。</p>
  </section>

  <div class="chips" id="chips" role="group" aria-label="依群別篩選"></div>

  <div class="stage">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 1000 826" role="img" aria-label="新竹縣市高級中等學校分布地圖"></svg>
      <div class="maptools" role="group" aria-label="地圖範圍">
        <button class="seg" data-zoom="all" aria-pressed="true" type="button">新竹</button>
        <button class="seg" data-zoom="city" aria-pressed="false" type="button">市區</button>
        <button class="seg" data-zoom="zhubei" aria-pressed="false" type="button">竹北湖口</button>
        <button class="seg" data-zoom="east" aria-pressed="false" type="button">竹東關西</button>
        <button class="seg" data-zoom="region" aria-pressed="false" type="button">桃竹苗</button>
      </div>
      <div class="sidectl">
        <div class="compass" aria-hidden="true"><span>▲</span>N</div>
        <button class="rbtn" id="zin" type="button" aria-label="放大">＋</button>
        <button class="rbtn" id="zout" type="button" aria-label="縮小">－</button>
        <button class="rbtn" id="fullBtn" type="button" aria-pressed="false" aria-label="全螢幕地圖" title="全螢幕地圖"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="fullIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="rbtn" id="railBtn" aria-pressed="true" type="button" aria-label="顯示火車站" title="顯示／隱藏火車站"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="4"/><path d="M5 10h14M9 21l-2-3M15 21l2-3"/><circle cx="9" cy="14" r=".6" fill="currentColor"/><circle cx="15" cy="14" r=".6" fill="currentColor"/></svg></button>
      </div>
      <div class="hint" id="hint">滾輪放大縮小・按住拖曳移動</div>
      <button class="fullpill" id="fullPill" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全螢幕看地圖</button>
      <div class="coop" id="coop" aria-hidden="true">用兩指縮放、移動地圖<br>或按「全螢幕看地圖」</div>
      <label class="fullcat" for="catSel"><span>群別</span><select id="catSel"><option value="">全部學校</option></select></label>
      <div class="mini" id="mini" hidden></div>
      <button class="phase" id="phase" type="button" title="切換時段"></button>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section class="tablebox">
    <h3 id="tblTitle">全部開缺科別</h3>
    <div class="scroll"><table>
      <thead><tr><th>群別</th><th>科別</th><th>學校</th><th>地區</th><th class="n" id="thDist" hidden>離家直線</th><th class="n">名額</th><th>備註</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <p class="note" style="margin-top:10px">資料來源：115學年度適性輔導安置簡章「安置高級中等學校」新竹區名額表（3-28～3-29頁）。地圖上的學校位置為示意，實際校址請以各校官網或 Google 地圖為準。</p>
  </section>

  mapbox.classList.toggle("full",on);document.body.classList.toggle("lock",on);
  fullBtn.setAttribute("aria-pressed",on);fullBtn.setAttribute("aria-label",on?"離開全螢幕":"全螢幕地圖");fullBtn.title=on?"離開全螢幕":"全螢幕地圖";
  document.getElementById("fullIco").setAttribute("d",on?"M6 6l12 12M18 6L6 18":"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5");

  if(on){const h=document.getElementById("hint");h.textContent=matchMedia("(pointer:coarse)").matches?"單指拖曳・兩指縮放":"滾輪放大縮小・按住拖曳移動";h.hidden=false;h.style.opacity=1;
    setTimeout(()=>{h.style.opacity=0;setTimeout(()=>h.hidden=true,700)},2600)}
  else mapbox.scrollIntoView({block:"center"});

fullBtn.onclick=()=>setFull(!isFull());
document.getElementById("fullPill").onclick=()=>setFull(true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&isFull())setFull(false)});

/* 全螢幕時，底部的小卡顯示選到的學校或群別 */

      <p>${home?`離家直線 ${fmtKm(km(s))}・`:""}最近車站：${ns.s.name}站（${fmtKm(ns.d)}）</p>
      <div class="acts"><button class="primary" type="button" id="miniMore">看科別與名額</button><a href="${siteOf(s.name)}" target="_blank" rel="noopener">學校官網 ↗</a>${home?`<a href="${route(s,"transit")}" target="_blank" rel="noopener">查路線 ↗</a>`:""}</div>`}
  else{const c=CAT[state.cat],n=new Set(ROWS.filter(matchRow).map(r=>r.s)).size;
    miniEl.innerHTML=`<h4 style="color:${c.c}">${c.name}</h4><p>${n} 所學校開設，點有顏色的學校看細節。</p>
      <div class="acts"><button class="primary" type="button" id="miniMore">看學校清單</button></div>`}
  document.getElementById("miniMore").onclick=()=>{setFull(false);document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"start"})}}
document.getElementById("railBtn").onclick=e=>{showRail=!showRail;e.currentTarget.setAttribute("aria-pressed",showRail);railG.style.display=stationG.style.display=showRail?"":"none"};
const inCity=s=>s.lng>120.95&&s.lng<121.0&&s.lat>24.785&&s.lat<24.815;
let hover=null;
function nodeBoost(){const w=svg.clientWidth||800;return Math.min(1.4,Math.max(1,640/w))}
function scaleNodes(){const k=Math.max(vb[2]/1000,.03)*nodeBoost();
  const zoomed=vb[2]<700;
  STATIONS.forEach(([n])=>{const s=ST[n];s.g.setAttribute("transform",`translate(${s.x},${s.y}) scale(${k*(zoomed?.85:.62)})`);s.lbl.style.display=(s.major||zoomed)?"":"none"});SC.forEach(s=>nodes[s.name].g.setAttribute("transform",`translate(${s.x},${s.y}) scale(${k})`));
  if(home){const[x,y]=P(home.lng,home.lat);houseG.setAttribute("transform",`translate(${x},${y}) scale(${k})`);
    ringG.querySelectorAll("text").forEach(t=>t.setAttribute("font-size",13*k))}
  relabel()}
function relabel(){const zoomed=vb[2]<700;
  SC.forEach(s=>{const show=zoomed||s.name===hover||s.name===state.school;nodes[s.name].lbl.style.display=show?"":"none"});
  const k=Math.max(vb[2]/1000,.14);
  distLabels.forEach(d=>{
    const hot=d.s.name===hover||d.s.name===state.school;
    d.line.classList.toggle("hot",hot);d.line.setAttribute("stroke",hot?"#ff7a45":"#ffffff");d.line.setAttribute("stroke-width",hot?3:1.4);d.line.setAttribute("opacity",hot?1:.55);
    if(hot)homeLineG.appendChild(d.line)})}
function setPill(s,dist){const g=nodes[s.name].lbl,t=g.querySelector("text"),r=g.querySelector("rect");
  t.textContent=s.short;g.querySelectorAll(".pd").forEach(e=>e.remove());
  let w=s.short.length*15+18,h=24;
  if(dist){const d=el("text",{class:"pd",y:s.r+40,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"#ffc29e",style:"font-variant-numeric:tabular-nums"},g);
    d.textContent="離家 "+dist;w=Math.max(w,(3+dist.length)*7.5+22);h=40}
  r.setAttribute("x",-w/2);r.setAttribute("width",w);r.setAttribute("height",h);r.setAttribute("rx",h>24?14:12)}
/* 從我家到各校的虛線與距離標籤 */
let distLabels=[];
function drawHomeLines(act){
  homeLineG.innerHTML="";distLabels=[];SC.forEach(x=>setPill(x,null));if(!home)return;
  const[hx,hy]=P(home.lng,home.lat);const filtering=state.cat||state.q;
  SC.forEach(s=>{if(filtering&&!act.has(s.name))return;
    const line=el("line",{class:"distline",x1:hx,y1:hy,x2:s.x,y2:s.y,stroke:"#ffffff","stroke-width":1.4,"stroke-dasharray":"4 6","stroke-linecap":"round","vector-effect":"non-scaling-stroke",opacity:.55},homeLineG);
    // 把距離併進校名標籤：「光復高中｜4.3 km」
    const g=nodes[s.name].lbl;setPill(s,(km(s)<1?"<1":km(s).toFixed(1))+" km");
    distLabels.push({s,g,line})});
}

/* 狀態與篩選 */
const state={cat:null,q:"",school:null};
function matchRow(r){
  if(state.cat&&r.cat!==state.cat)return false;
  if(state.q){const q=state.q;const s=BYNAME[r.s];
    return (r.s+r.d+r.g+CAT[r.cat].name+s.town+(r.note||"")).includes(q)}
  return true}
function activeSchools(){return new Set(ROWS.filter(matchRow).map(r=>r.s))}

/* ===== 我家位置與距離 ===== */
const TOWN_PTS=[["新竹市東區",24.800,120.975],["新竹市北區",24.815,120.960],["新竹市香山區",24.790,120.925],
 ["竹北市",24.835,121.005],["竹東鎮",24.737,121.090],["新埔鎮",24.828,121.075],["關西鎮",24.790,121.175],
 ["湖口鄉",24.895,121.045],["新豐鄉",24.885,120.990],["芎林鄉",24.775,121.090],["寶山鄉",24.758,121.005],
 ["橫山鄉",24.720,121.115],["北埔鄉",24.700,121.058],["峨眉鄉",24.688,121.018],["尖石鄉",24.705,121.195],["五峰鄉",24.675,121.110],
 ["苗栗縣竹南鎮",24.686,120.873],["苗栗縣頭份市",24.688,120.913],["桃園市楊梅區",24.914,121.146],["桃園市新屋區",24.972,121.105]];
const townSel=document.getElementById("town");
TOWN_PTS.forEach(([n])=>{const o=document.createElement("option");o.value=n;o.textContent=n;townSel.appendChild(o)});
let home=null,pinMode=false;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const addrEl=document.getElementById("addr");
const km=s=>{const R=6371,toR=Math.PI/180,dLa=(s.lat-home.lat)*toR,dLo=(s.lng-home.lng)*toR;
  const a=Math.sin(dLa/2)**2+Math.cos(home.lat*toR)*Math.cos(s.lat*toR)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(a))};
const fmtKm=d=>d<1?"不到 1 公里":d.toFixed(1)+" 公里";
const rideMin=d=>Math.max(5,Math.round(d*1.35/28*60/5)*5); // 道路約為直線 1.35 倍、平均時速約 28 公里
const byDist=list=>home?[...list].sort((a,b)=>km(BYNAME[a[0]])-km(BYNAME[b[0]])):list;
const origin=()=>addrEl.value.trim()||(home?`${home.lat.toFixed(5)},${home.lng.toFixed(5)}`:"");
const route=(s,mode)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin())}&destination=${encodeURIComponent(s.name.replace(/^(國立|私立|市立|縣立)/,"新竹 "))}&travelmode=${mode}`;

function setHome(h){home=h;store.set("isle-home",h);
  if(h&&h.town)townSel.value=h.town;drawHome();render()}
function drawHome(){
  ringG.innerHTML="";houseG.innerHTML="";
  const on=!!home;document.getElementById("clearHome").hidden=!on;document.getElementById("homebar").classList.toggle("on",on);
  document.getElementById("thDist").hidden=!on;
  if(!on)return;
  const[x,y]=P(home.lng,home.lat);const U=24.8; // 每公里約 24.8 地圖單位
  [5,10,20].forEach(r=>{el("circle",{cx:x,cy:y,r:r*U,fill:"none",stroke:"#ffffff","stroke-width":2,"stroke-dasharray":"4 6",opacity:.85},ringG);
    const t=el("text",{x:x+r*U*.71+4,y:y-r*U*.71-4,fill:"#ffffff","font-size":13,"font-weight":700,style:"paint-order:stroke;stroke:#2a4a55;stroke-width:3px"},ringG);t.textContent=r+" 公里"});
  el("circle",{r:22,fill:"#ff7a45",opacity:.25},houseG);
  el("path",{d:"M0,-20 L16,-6 L12,-6 L12,10 L-12,10 L-12,-6 L-16,-6Z",fill:"#ff7a45",stroke:"#fff","stroke-width":2.5,"stroke-linejoin":"round"},houseG);
  el("rect",{x:-4,y:0,width:8,height:10,fill:"#fff"},houseG);
  const t=el("text",{y:28,"text-anchor":"middle","font-size":13,"font-weight":700,fill:"#2a2a22",style:"paint-order:stroke;stroke:#fffaf0;stroke-width:3.5px"},houseG);t.textContent="我家";
  scaleNodes();
}
townSel.onchange=()=>{const t=TOWN_PTS.find(p=>p[0]===townSel.value);
  if(!t){setHome(null);return}
  setHome({lat:t[1],lng:t[2],town:t[0],exact:false});
  document.getElementById("homeNote").textContent=`已用${t[0]}中心點估算。到地圖上點出家的位置，距離會更準。`};
const pinBtn=document.getElementById("pin");
pinBtn.onclick=()=>{pinMode=!pinMode;pinBtn.setAttribute("aria-pressed",pinMode);document.querySelector(".mapbox").classList.toggle("pinning",pinMode);
  document.getElementById("homeNote").textContent=pinMode?"請在地圖上點一下家的位置（可先用左上角按鈕放大地區）。":"已取消點選。";
  if(pinMode)document.querySelector(".mapbox").scrollIntoView({behavior:"smooth",block:"center"})};
document.getElementById("clearHome").onclick=()=>{townSel.value="";setHome(null);document.getElementById("homeNote").textContent="已清除家的位置。"};
addrEl.value=store.get("isle-addr")||"";
addrEl.addEventListener("input",()=>store.set("isle-addr",addrEl.value));
function placePin(e){
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const lng=p.x/KX+LNG0,lat=LAT1-p.y/KY;
  const near=TOWN_PTS.reduce((b,t)=>{const d=Math.hypot(t[1]-lat,(t[2]-lng)*.9);return!b||d<b.d?{t,d}:b},null);
  pinMode=false;pinBtn.setAttribute("aria-pressed",false);document.querySelector(".mapbox").classList.remove("pinning");
  setHome({lat,lng,town:near.t[0],exact:true});
  document.getElementById("homeNote").textContent="已標出家的位置。距離是地圖直線估算，實際通勤請按學校卡片裡的「查路線」。";
}
function homeSummary(){
  if(!home)return"";
  const list=SC.map(s=>[s,km(s)]).sort((a,b)=>a[1]-b[1]);
  const w5=list.filter(x=>x[1]<=5).length,w10=list.filter(x=>x[1]<=10).length;
  const hs=nearestStation(home.lat,home.lng);
  return `<div class="homestat">家附近 5 公里內有 <b>${w5}</b> 所、10 公里內有 <b>${w10}</b> 所學校。離家最近的火車站是 <b>${hs.s.name}站</b>（約 ${fmtKm(hs.d)}）。</div>
   <div class="eyebrow" style="margin-top:4px">離家由近到遠</div>
   <div class="list">${list.map(([s,d])=>`<button class="row-btn" type="button" data-s="${s.name}"><span>${s.name}</span><span>${fmtKm(d)}・騎車約 ${rideMin(d)} 分</span></button>`).join("")}</div>`;
}

function render(){
  const act=activeSchools();const filtering=state.cat||state.q;
  SC.forEach(s=>{const n=nodes[s.name].g;n.classList.toggle("dim",filtering&&!act.has(s.name));n.classList.toggle("lit",!!filtering&&act.has(s.name));n.classList.toggle("sel",state.school===s.name)});
  svg.style.setProperty("--lit",state.cat?CAT[state.cat].c:"#ffd36b");
  // 有選學校或群別時，學校放在車站上層，亮起來的學校不會被車站蓋住
  svg.insertBefore(filtering||state.school?schoolG:stationG,houseG);
  svg.classList.toggle("has-sel",!!state.school);
  // 把選取的學校移到最上層
  if(state.school)schoolG.appendChild(nodes[state.school].g);
  drawHomeLines(act);
  renderChips();renderTable();renderPanel(act);relabel();if(typeof renderMini==="function")renderMini();
}

/* 同群連線（最小生成樹，讓同一群的學校串成一條航線） */
function drawLinks(act){
  linkG.innerHTML="";if(!state.cat)return;
  const pts=SC.filter(s=>act.has(s.name));if(pts.length<2)return;
  const col=CAT[state.cat].c;const inT=new Set([0]);
  while(inT.size<pts.length){let best=null;
    inT.forEach(i=>pts.forEach((p,j)=>{if(inT.has(j))return;const d=Math.hypot(p.x-pts[i].x,p.y-pts[i].y);if(!best||d<best.d)best={i,j,d}}));
    inT.add(best.j);const a=pts[best.i],b=pts[best.j];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-best.d*.18;
    el("path",{class:"link-line",d:`M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`,stroke:col},linkG)}
}

/* 群別按鈕 */
const chipsEl=document.getElementById("chips");
CATS.forEach(c=>{c.total=ROWS.filter(r=>r.cat===c.id).reduce((a,r)=>a+r.n,0);
  const b=document.createElement("button");b.type="button";b.className="chip";b.style.setProperty("--c",c.c);b.dataset.cat=c.id;
  b.innerHTML=`<i></i>${c.name}<em>${c.total}</em>`;b.onclick=()=>{state.cat=state.cat===c.id?null:c.id;state.school=null;render()};chipsEl.appendChild(b)});

CATS.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=`${c.name}（${c.total} 名）`;catSel.appendChild(o)});
catSel.onchange=()=>{state.cat=catSel.value||null;state.school=null;render()};
function renderChips(){chipsEl.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===state.cat));catSel.value=state.cat||""}

/* 名額表 */
function renderTable(){
  let rows=ROWS.filter(matchRow);if(state.school)rows=rows.filter(r=>r.s===state.school);
  if(home)rows=[...rows].sort((a,b)=>km(BYNAME[a.s])-km(BYNAME[b.s]));
  const t=state.school?state.school:state.cat?CAT[state.cat].name:state.q?`搜尋「${state.q}」`:"全部開缺科別";
  const sum=rows.reduce((a,r)=>a+r.n,0);
  document.getElementById("tblTitle").textContent=`${t}｜${rows.length} 個科別、${sum} 個名額`;
  document.getElementById("tbody").innerHTML=rows.map(r=>`<tr class="clk" data-s="${r.s}"><td><span class="gdot" style="background:${CAT[r.cat].c}"></span>${CAT[r.cat].name}</td><td>${r.d}</td><td><a class="link" href="${siteOf(r.s)}" target="_blank" rel="noopener" title="${SITES[r.s]?"前往學校官網":"搜尋學校官網"}">${r.s}</a></td><td>${BYNAME[r.s].town}</td>${home?`<td class="n">${fmtKm(km(BYNAME[r.s]))}</td>`:""}<td class="n">${r.n}</td><td>${r.note}</td></tr>`).join("")||`<tr><td colspan="7">沒有符合的科別，換個關鍵字試試。</td></tr>`;
  document.querySelectorAll("#tbody tr.clk").forEach(tr=>tr.onclick=e=>{if(e.target.closest("a"))return;selectSchool(tr.dataset.s);document.querySelector(".mapbox").scrollIntoView({behavior:"smooth",block:"start"})});
}

/* 說明卡 */
const panel=document.getElementById("panel");
const gmap=n=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(n.replace(/^(國立|私立|市立|縣立)/,"新竹 "))}`;
function deptRows(rows,max){return `<div class="dept">${rows.map(r=>`<span class="dot" style="background:${CAT[r.cat].c}"></span><span>${r.d}${r.note?` <small>（${r.note}）</small>`:""}<br><small>${CAT[r.cat].name}</small></span><b>${r.n} 名</b><div class="bar"><span style="width:${r.n/max*100}%;background:${CAT[r.cat].c}"></span></div>`).join("")}</div>`}
function schoolList(list,val){return `<div class="list">${byDist(list).map(([s,v])=>`<button class="row-btn" type="button" data-s="${s}"><span>${s}</span><span>${val(v)}${home?`・${fmtKm(km(BYNAME[s]))}`:""}</span></button>`).join("")}</div>`}
function bindList(){panel.querySelectorAll(".row-btn").forEach(b=>b.onclick=()=>selectSchool(b.dataset.s))}

function renderPanel(act){
  if(state.school){const s=BYNAME[state.school];
    const rows=[...s.rows].sort((a,b)=>b.n-a.n);const max=Math.max(...rows.map(r=>r.n));
    const notes=[...new Set(rows.map(r=>r.note).filter(Boolean))];
    const typeName={國立:"國立",私立:"私立",市立:"新竹市立",縣立:"新竹縣立"}[s.type];
    // 同科別的其他學校
    const same=ROWS.filter(r=>r.s!==s.name&&rows.some(x=>x.d===r.d));
    const sameMap={};same.forEach(r=>{(sameMap[r.d]=sameMap[r.d]||[]).push(r.s)});
    panel.innerHTML=`<div class="eyebrow">${s.town}</div><h2>${s.name}</h2>
      <div class="meta"><span class="tag">${typeName}</span>${s.pending?`<span class="tag warn">尚未確定是否開缺</span>`:`<span class="tag">${rows.length} 個科別</span><span class="tag">共 ${s.total} 名</span>`}${notes.map(n=>`<span class="tag warn">部分${n}</span>`).join("")}${s.approx?`<span class="tag warn">地圖位置待確認</span>`:""}${s.tag?`<span class="tag">${s.tag}</span>`:""}</div>
      ${home?`<div class="dist">離家直線 <b>${fmtKm(km(s))}</b>，騎車或開車約 <b>${rideMin(km(s))}</b> 分鐘<br><small class="note">粗估值，實際時間請查路線</small></div>
      <div class="routes"><a href="${route(s,"transit")}" target="_blank" rel="noopener">查公車／火車路線 ↗</a><a href="${route(s,"driving")}" target="_blank" rel="noopener">查開車路線 ↗</a><a href="${route(s,"bicycling")}" target="_blank" rel="noopener">查單車路線 ↗</a></div>`
      :`<p class="note">在上方填好「我家在」，這裡就會顯示離家距離和路線。</p>`}
      ${(()=>{const ns=nearestStation(s.lat,s.lng);return `<p class="note" style="color:var(--fg)">最近的火車站：<b>${ns.s.name}站</b>，直線約 ${fmtKm(ns.d)}${ns.d<=1.2?"，步行可到":ns.d<=3?"，可轉乘公車或騎車":"，需轉乘公車或接送"}</p>`})()}
      ${s.pending?`<p class="note" style="color:var(--fg)">這是 116 學年新設立的學校，目前不在本次適性輔導安置的名額表中，還不確定是否會開缺。先標在地圖上，方便家長認識位置。</p>`:deptRows(rows,max)}
      <div class="routes"><a href="${siteOf(s.name)}" target="_blank" rel="noopener">${SITES[s.name]?"前往學校官網 ↗":"搜尋學校官網 ↗"}</a><a href="${gmap(s.name)}" target="_blank" rel="noopener">在 Google 地圖看位置 ↗</a></div>
      ${Object.keys(sameMap).length?`<div><div class="eyebrow" style="margin-bottom:4px">同科別也開在</div>${Object.entries(sameMap).map(([d,ss])=>`<p class="note"><b>${d}</b>：${ss.map(x=>`<a href="#" class="link" data-s="${x}">${BYNAME[x].short}</a>`).join("、")}</p>`).join("")}</div>`:""}
      <button class="btn" type="button" id="back">← 回到總覽</button>`;
    panel.querySelectorAll("a[data-s]").forEach(a=>a.onclick=e=>{e.preventDefault();selectSchool(a.dataset.s)});
    document.getElementById("back").onclick=()=>{state.school=null;render()};
    return}
  if(state.cat){const c=CAT[state.cat];
    const rows=ROWS.filter(matchRow);const per={};rows.forEach(r=>per[r.s]=(per[r.s]||0)+r.n);
    const depts=[...new Set(rows.map(r=>r.d))];
    panel.innerHTML=`<div class="eyebrow">群別</div><h2 style="color:${c.c}">${c.name}</h2><p class="note" style="color:var(--fg)">${c.about}</p>
      <div class="meta">${depts.map(d=>`<span class="tag">${d}</span>`).join("")}</div>
      <p class="note">地圖上有顏色的就是開設這一群的學校，其他學校會變灰。點學校看細節。</p>
      ${schoolList(Object.entries(per).sort((a,b)=>b[1]-a[1]),v=>v+" 名")}`;
    bindList();return}
  if(state.q){const rows=ROWS.filter(matchRow);const per={};rows.forEach(r=>per[r.s]=(per[r.s]||0)+r.n);
    panel.innerHTML=`<div class="eyebrow">搜尋結果</div><h2>「${state.q}」</h2><p class="note">${Object.keys(per).length} 所學校、${rows.length} 個科別符合。</p>${schoolList(Object.entries(per).sort((a,b)=>b[1]-a[1]),v=>v+" 名")}`;
    bindList();return}
  // 總覽
  const max=Math.max(...CATS.map(c=>c.total));
  panel.innerHTML=`<div class="eyebrow">怎麼看這座島</div><h2>點一所學校，或選一個群別</h2>
    <p class="note" style="color:var(--fg)">每個圓圈是一所學校，中間是學校簡稱，圓圈越大代表安置名額越多，外圈顏色是各群所占比例。選群別後，沒有開這一群的學校會變灰。</p>
    <div class="dept">${[...CATS].sort((a,b)=>b.total-a.total).map(c=>`<span class="dot" style="background:${c.c}"></span><span>${c.name}</span><b>${c.total}</b><div class="bar"><span style="width:${c.total/max*100}%;background:${c.c}"></span></div>`).join("")}</div>
    <p class="note">標示「限男生／限女生」的科別只安置該性別學生。</p>
    ${homeSummary()}`;
  bindList();
}

function selectSchool(n){state.school=n;render();
  if(isFull()){const s0=BYNAME[n],m=svg.getScreenCTM(),r=svg.getBoundingClientRect();
    const sx=s0.x*m.a+m.e,sy=s0.y*m.d+m.f,tx=r.left+r.width/2,ty=r.top+r.height*.36;
    setVB([vb[0]+(sx-tx)/m.a,vb[1]+(sy-ty)/m.d,vb[2]]);return}
  const s=BYNAME[n];if(vb[2]>700&&inCity(s))setView("city")}
function showBoat(){state.school=null;panel.innerHTML=`<div class="eyebrow">你發現了沿岸的小船</div><h2>每個孩子都有自己的航道</h2>
  <p class="note" style="color:var(--fg)">選校時，先看孩子喜歡做什麼、擅長什麼，再看通勤距離與學校支持。名額多不代表比較適合，親自到校參觀最準。</p>
  <button class="btn" type="button" id="back">← 回到總覽</button>`;document.getElementById("back").onclick=()=>render()}

/* 搜尋 */
let tm;document.getElementById("q").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{state.q=e.target.value.trim();state.school=null;render()},120)});
document.getElementById("reset").onclick=()=>{state.cat=null;state.q="";state.school=null;document.getElementById("q").value="";setView("all");render()};
svg.addEventListener("click",e=>{if(dragGuard())return;if(pinMode){placePin(e);return}if(state.school){state.school=null;render()}});

/* 統計 */
document.getElementById("stS").textContent=SC.filter(x=>x.total>0).length;
document.getElementById("stD").textContent=ROWS.length;
document.getElementById("stQ").textContent=ROWS.reduce((a,r)=>a+r.n,0);
home=store.get("isle-home");if(home&&home.town)townSel.value=home.town;
drawHome();scaleNodes();render();
setTimeout(()=>{const h=document.getElementById("hint");h.style.opacity=0;setTimeout(()=>h.hidden=true,700)},7000);
</script>
</body>
</html>
